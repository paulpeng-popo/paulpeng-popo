<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="220" fill="url(#bg)"/>
  <path fill="url(#wave)" d="M0 170 C150 130 300 210 500 170 C700 130 850 210 1000 160 L1000 220 L0 220 Z">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 170 C150 130 300 210 500 170 C700 130 850 210 1000 160 L1000 220 L0 220 Z;
              M0 160 C150 200 300 130 500 175 C700 210 850 130 1000 170 L1000 220 L0 220 Z;
              M0 170 C150 130 300 210 500 170 C700 130 850 210 1000 160 L1000 220 L0 220 Z"/>
  </path>
  <text x="500" y="105" text-anchor="middle" fill="#ffffff" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="700" opacity="0">
    Paul Peng
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="148" text-anchor="middle" fill="#bfe9ff" font-family="Helvetica, Arial, sans-serif" font-size="20" opacity="0">
    Builder of useful &amp; fun things
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="1.2s" fill="freeze"/>
  </text>
</svg>
